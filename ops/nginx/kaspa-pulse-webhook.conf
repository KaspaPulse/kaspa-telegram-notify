# Kaspa Pulse canonical public webhook reverse-proxy reference.
# This is a reference configuration, not a copy of live production state.
#
# Keep the Rust application listeners on loopback:
#   WEBHOOK_BIND=127.0.0.1
#   WEBHOOK_PORT=8443
#   HEALTH_BIND=127.0.0.1
#   HEALTH_PORT=18080
#
# Only the Telegram webhook path is public. Health, readiness, and metrics
# remain local operational interfaces and must not be exposed by this proxy.

limit_req_zone $binary_remote_addr zone=telegram_webhook:10m rate=10r/s;

server {
    listen 443 ssl http2;
    server_name api.example.com;

    # ssl_certificate     /etc/letsencrypt/live/api.example.com/fullchain.pem;
    # ssl_certificate_key /etc/letsencrypt/live/api.example.com/privkey.pem;

    client_max_body_size 1m;

    location = /webhook {
        limit_req zone=telegram_webhook burst=20 nodelay;

        proxy_pass http://127.0.0.1:8443/webhook;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;

        proxy_connect_timeout 5s;
        proxy_send_timeout 30s;
        proxy_read_timeout 30s;

        # Telegram webhook authentication is validated by the application.
        # Do not log request bodies that may contain user messages.
    }

    location = /healthz {
        return 404;
    }

    location = /readyz {
        return 404;
    }

    location = /metrics {
        return 404;
    }

    location / {
        return 404;
    }
}
