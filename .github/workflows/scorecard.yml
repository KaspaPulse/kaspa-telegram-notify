name: OpenSSF Scorecard

on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: "47 4 * * 6"

permissions: read-all

concurrency:
  group: scorecard-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  full_scorecard:
    name: Full supply-chain posture
    if: github.repository_visibility == 'public'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Run canonical OpenSSF Scorecard
        uses: ossf/scorecard-action@2d1146689b8cda280b9bc96326124645441f03bc # v2.4.4
        with:
          results_file: full-results.json
          results_format: json
          publish_results: true

      - name: Upload full Scorecard artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: openssf-scorecard-full-json
          path: full-results.json
          retention-days: 5

  analysis:
    name: Actionable supply-chain posture
    if: github.repository_visibility == 'public'
    needs: full_scorecard
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      security-events: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Run Scorecard for actionable SARIF
        uses: ossf/scorecard-action@2d1146689b8cda280b9bc96326124645441f03bc # v2.4.4
        with:
          results_file: results.sarif
          results_format: sarif
          publish_results: false

      - name: Apply solo-maintainer SARIF policy
        run: |
          python3 scripts/filter-scorecard-sarif.py \
            results.sarif \
            results.filtered.sarif

      - name: Upload actionable SARIF artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: openssf-scorecard-actionable-sarif
          path: results.filtered.sarif
          retention-days: 5

      - name: Upload actionable findings to code scanning
        uses: github/codeql-action/upload-sarif@b96794f015dfd88f77b49b1c93e0fa7110f94c63 # v4.38.0
        with:
          sarif_file: results.filtered.sarif
