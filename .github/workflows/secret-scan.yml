name: Secret Scan

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  schedule:
    - cron: "17 4 * * 3"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: secret-scan-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  trufflehog:
    name: TruffleHog verified and unknown secrets
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
      - name: Checkout full history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install verified TruffleHog 3.96.0 binary
        shell: bash
        run: |
          set -euo pipefail
          archive="/tmp/trufflehog-3.96.0.tar.gz"
          extract_dir="/tmp/trufflehog-3.96.0"
          curl --proto '=https' --tlsv1.2 --fail --location --silent --show-error \
            --output "$archive" \
            "https://github.com/trufflesecurity/trufflehog/releases/download/v3.96.0/trufflehog_3.96.0_linux_amd64.tar.gz"
          echo "7105f1cd6577f058a9e39d0578f1a99c8a1e481e4d3512cd8a09acfe22a0fdc0  $archive" | sha256sum --check --strict
          mkdir -p "$extract_dir"
          tar -xzf "$archive" -C "$extract_dir"
          binary="$(find "$extract_dir" -maxdepth 2 -type f -name trufflehog -print -quit)"
          test -n "$binary"
          sudo install -m 0755 "$binary" /usr/local/bin/trufflehog
          trufflehog --version

      - name: Scan repository history for high-confidence secrets
        run: >-
          trufflehog
          --no-update
          --no-color
          --results=verified,unknown
          --fail
          --fail-on-scan-errors
          git file://.
          --branch HEAD
