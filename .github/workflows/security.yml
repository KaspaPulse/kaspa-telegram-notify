# KASPA_TELEGRAM_AUTOMERGE_V2 - mandatory dependency security runs on every PR and main push.
name: Dependency & Supply Chain Security

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: "17 3 * * 0"

permissions:
  contents: read

concurrency:
  group: security-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  supply-chain:
    name: policy + audit + deny + machete
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Rust 1.99.0
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          toolchain: 1.99.0

      - name: Validate advisory exception policy
        run: cargo xtask security advisories --max-age-days 45

      - name: Enforce generic production/non-production boundary
        run: cargo xtask security environment-boundary

      - name: Verify documentation and governance path contracts
        run: cargo xtask security documentation

      - name: Validate Security Insights against OpenSSF v2.2.0 schema
        shell: bash
        run: |
          set -euo pipefail
          cue_archive="${RUNNER_TEMP}/cue-v0.17.1.tar.gz"
          cue_dir="${RUNNER_TEMP}/cue-v0.17.1"
          schema="${RUNNER_TEMP}/security-insights-v2.2.0-schema.cue"
          curl --proto '=https' --tlsv1.2 --fail --location --silent --show-error             --output "$cue_archive"             "https://github.com/cue-lang/cue/releases/download/v0.17.1/cue_v0.17.1_linux_amd64.tar.gz"
          echo "a39b0c97695069d95d276d99be0f5dbabb081d801bfdc9ba49b76efaf94e2369  $cue_archive" | sha256sum --check --strict
          mkdir -p "$cue_dir"
          tar -xzf "$cue_archive" -C "$cue_dir"
          cue_binary="$(find "$cue_dir" -maxdepth 2 -type f -name cue -print -quit)"
          test -n "$cue_binary"
          curl --proto '=https' --tlsv1.2 --fail --location --silent --show-error             --output "$schema"             "https://raw.githubusercontent.com/ossf/security-insights/701ac2a02ef17fc8b316f5df685428773c51372a/spec/schema.cue"
          echo "4e4b61470b5484fc8969f2a8a77ffbe0712a7c8a870c2079188f246c14cd58b1  $schema" | sha256sum --check --strict
          "$cue_binary" vet -d '#SecurityInsights' "$schema" security-insights.yml

      - name: Verify Security Insights metadata contract
        run: cargo xtask security metadata

      - name: Enforce immutable rusty-kaspa dependency pins
        run: cargo xtask security kaspa-pins

      - name: Enforce immutable GitHub Action references
        run: cargo xtask security action-pins

      - name: Verify fail-closed Rust-only and native trust proofs
        run: cargo xtask proof verify

      - name: Upload machine-readable proof artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: rust-only-proof-${{ github.sha }}
          path: target/proof/*.json
          if-no-files-found: error
          retention-days: 30

      - name: Install supply-chain tools
        uses: taiki-e/install-action@83ac0ad63c0167e6f06796fab0fce28db1bf3db0 # v2.87.22
        with:
          tool: cargo-audit,cargo-deny,cargo-machete
          fallback: none

      - name: Cargo audit
        run: cargo audit

      - name: Cargo deny
        run: cargo deny check

      - name: Unused dependency scan
        run: cargo machete

      - name: Duplicate dependency report
        run: cargo tree --locked -d

  osv-scan:
    name: OSV full dependency scan
    permissions:
      actions: read
      contents: read
      security-events: write
    uses: google/osv-scanner-action/.github/workflows/osv-scanner-reusable.yml@a345acffa64b0eaede81a3d9aae6141214d9c8fc # v2.6.0
    with:
      scan-args: |-
        --lockfile=./Cargo.lock
      fail-on-vuln: true
