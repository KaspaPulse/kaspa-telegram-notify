# KASPA_TELEGRAM_AUTOMERGE_V2 - mandatory dependency security runs on every PR and main/dev push.
name: Dependency & Supply Chain Security

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]
  workflow_dispatch:
  schedule:
    - cron: "17 3 * * 0"

permissions:
  contents: read

concurrency:
  group: security-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  supply-chain:
    name: policy + audit + deny + machete
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Rust 1.98.1
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          toolchain: 1.98.1

      - name: Validate advisory exception policy
        run: cargo xtask security advisories --max-age-days 45

      - name: Enforce immutable rusty-kaspa dependency pins
        run: cargo xtask security kaspa-pins

      - name: Enforce immutable GitHub Action references
        run: cargo xtask security action-pins

      - name: Verify fail-closed Rust-only and native trust proofs
        run: cargo xtask proof verify

      - name: Upload machine-readable proof artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: rust-only-proof-${{ github.sha }}
          path: target/proof/*.json
          if-no-files-found: error
          retention-days: 30

      - name: Install supply-chain tools
        uses: taiki-e/install-action@9983c65e42da123ff25d1f78505eb6de315aa172 # v2.87.20
        with:
          tool: cargo-audit,cargo-deny,cargo-machete
          fallback: none

      - name: Cargo audit
        run: cargo audit

      - name: Cargo deny
        run: cargo deny check

      - name: Unused dependency scan
        run: cargo machete

      - name: Duplicate dependency report
        run: cargo tree --locked -d

  osv-scan:
    name: OSV full dependency scan
    permissions:
      actions: read
      contents: read
      security-events: write
    uses: google/osv-scanner-action/.github/workflows/osv-scanner-reusable.yml@a345acffa64b0eaede81a3d9aae6141214d9c8fc # v2.6.0
    with:
      scan-args: |-
        --lockfile=./Cargo.lock
      fail-on-vuln: true
