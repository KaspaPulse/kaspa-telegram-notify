# KASPA_TELEGRAM_AUTOMERGE_V1 - production builds and container smoke tests also run before merge.
name: Rust CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: rust-ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  SQLX_OFFLINE: true
  CARGO_INCREMENTAL: 0
  APP_ENV: ci
  RUST_LOG: info
  ENABLE_VERBOSE_LOGS: false
  BOT_TOKEN: "1234567890:TEST_PLACEHOLDER_TOKEN_NOT_REAL"
  ADMIN_USER_ID: "9000000000000000000"
  ADMIN_CHAT_ID: "9000000000000000000"
  TELEGRAM_API_URL: "http://127.0.0.1:9/"
  NODE_URL_01: "wss://example.invalid/json"
  DATABASE_URL: "postgresql://kaspa_pulse_app:TEST_PASSWORD@127.0.0.1:5432/kaspa_dev?sslmode=disable"
  DATABASE_ADMIN_URL: "postgresql://postgres:POSTGRES_TEST_PASSWORD@127.0.0.1:5432/kaspa_dev?sslmode=disable"
  WEBHOOK_SECRET_TOKEN: "TEST_WEBHOOK_SECRET_TOKEN_PLACEHOLDER_32_CHARS"
  USE_WEBHOOK: "false"
  WEBHOOK_DOMAIN: "example.invalid"
  WEBHOOK_PORT: "8443"
  WEBHOOK_BIND: "127.0.0.1"
  WEBHOOK_MAX_CONNECTIONS: "20"
  WEBHOOK_ALLOW_PUBLIC_BIND: "false"
  HEALTH_ENDPOINT_ENABLED: "true"
  HEALTH_BIND: "127.0.0.1"
  HEALTH_PORT: "18080"
  HEALTH_ALLOW_PUBLIC_BIND: "false"
  ENABLE_TELEGRAM_DELIVERY_QUEUE: "true"
  ENABLE_ALERT_DELIVERY: "true"
  MIN_REWARD_CONFIRMATIONS: "10"
  MAX_WALLETS_PER_USER: "10"
  RATE_LIMIT_COMMANDS_PER_SECOND: "1"
  RATE_LIMIT_CALLBACKS_PER_SECOND: "3"
  RATE_LIMIT_ADD_WALLET_PER_MINUTE: "5"
  MAX_RAW_MESSAGE_CHARS: "512"
  MAX_WALLET_ADDRESS_CHARS: "120"
  LOG_MAX_CHARS: "3000"

jobs:
  msrv-product:
    name: Product MSRV 1.97.1 compile + functional
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    services:
      postgres:
        image: postgres:18@sha256:a02db8cac496f15b094798a38254f14d6e00741f709360e5e00bb6668ea31636
        env:
          POSTGRES_DB: kaspa_dev
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: POSTGRES_TEST_PASSWORD
        options: >-
          --health-cmd "pg_isready -U postgres -d kaspa_dev"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
        ports:
          - 5432:5432

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install primary Rust 1.99.0 for repository tooling
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          toolchain: 1.99.0

      - name: Install product MSRV 1.97.1
        run: rustup toolchain install 1.97.1 --profile minimal

      - name: Install PostgreSQL client
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends postgresql-client

      - name: Prepare PostgreSQL test schema
        run: cargo +1.99.0 run --quiet --locked -p xtask -- ci prepare-postgres

      - name: Verify product MSRV compile
        run: cargo +1.97.1 check --locked --package kaspa-pulse --all-targets --all-features

      - name: Verify product MSRV functional tests
        run: cargo +1.97.1 test --locked --package kaspa-pulse --all-targets --all-features

  msrv-tooling:
    name: Tooling MSRV 1.98.1 compile + functional
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install tooling MSRV 1.98.1
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          toolchain: 1.98.1

      - name: Verify xtask MSRV compile
        run: cargo +1.98.1 check --locked --package xtask --all-targets --all-features

      - name: Verify xtask MSRV functional tests
        run: cargo +1.98.1 test --locked --package xtask --all-targets --all-features

      - name: Verify opqual-fixture MSRV compile
        run: cargo +1.98.1 check --locked --package opqual-fixture --all-targets --all-features

      - name: Verify opqual-fixture MSRV functional tests
        run: cargo +1.98.1 test --locked --package opqual-fixture --all-targets --all-features

  rust-version-contract:
    name: Package-scoped rust-version contract
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install primary Rust 1.99.0
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          toolchain: 1.99.0

      - name: Install declared package MSRV toolchains
        run: rustup toolchain install 1.97.1 1.98.1 --profile minimal

      - name: Install cargo-hack 0.6.45
        run: cargo install --locked cargo-hack --version 0.6.45

      - name: Verify every workspace package rust-version contract
        run: cargo hack check --rust-version --workspace --all-targets --all-features --locked

  quality:
    name: fmt + check + clippy + test
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    services:
      postgres:
        image: postgres:18@sha256:a02db8cac496f15b094798a38254f14d6e00741f709360e5e00bb6668ea31636
        env:
          POSTGRES_DB: kaspa_dev
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: POSTGRES_TEST_PASSWORD
        options: >-
          --health-cmd "pg_isready -U postgres -d kaspa_dev"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
        ports:
          - 5432:5432

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Rust 1.99.0
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          toolchain: 1.99.0
          components: clippy, rustfmt

      - name: Enforce generic production/non-production boundary
        run: cargo xtask security environment-boundary

      - name: Verify documentation and governance path contracts
        run: cargo xtask security documentation

      - name: Cache Cargo
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      - name: Show versions
        run: |
          rustc --version
          cargo --version

      - name: Install PostgreSQL client
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends postgresql-client

      - name: Prepare PostgreSQL test schema
        run: cargo xtask ci prepare-postgres

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Cargo check
        run: cargo check --locked --all-targets --all-features

      - name: Clippy strict
        run: cargo clippy --locked --all-targets --all-features -- -D warnings

      - name: Run tests
        run: cargo test --locked --all-targets --all-features

      - name: Build production release
        env:
          KASPA_PULSE_SOURCE_REVISION: ${{ github.sha }}
        run: cargo build --locked --release --all-features

      - name: Build production container
        run: docker build --pull --build-arg SOURCE_REVISION="$GITHUB_SHA" --tag kaspa-pulse:ci .

      - name: Smoke-test production container
        run: |
          docker run --rm --entrypoint /bin/sh kaspa-pulse:ci -c '
            test "$(id -u)" = "10001"
            test -x /usr/local/bin/kaspa-pulse
            touch /var/lib/kaspa-pulse/.write-test
          '
          output="$(docker run --rm kaspa-pulse:ci 2>&1 || true)"
          printf '%s\n' "$output"
          grep -F "DATABASE_URL must be set" <<< "$output"
