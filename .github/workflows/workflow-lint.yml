name: Workflow Lint

on:
  pull_request:
    branches: [main, dev]
    paths:
      - ".github/workflows/**"
      - "xtask/**"
  push:
    branches: [main, dev]
    paths:
      - ".github/workflows/**"
      - "xtask/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: workflow-lint-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  actionlint:
    name: actionlint
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Rust 1.98.1
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          toolchain: 1.98.1

      - name: Install actionlint 1.7.12
        uses: taiki-e/install-action@4076c08d76dba979c11a7285295b0716c1d67908 # v2.87.15
        with:
          tool: actionlint@1.7.12
          fallback: none

      - name: Lint GitHub Actions workflows
        run: actionlint -color

      - name: Test Rust-native repository policy tooling
        run: cargo test --locked -p xtask
