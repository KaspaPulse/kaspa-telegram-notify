name: Signed Release

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    paths:
      - "Cargo.toml"
      - "Cargo.lock"
      - "xtask/src/sbom.rs"
      - ".github/workflows/release.yml"
  workflow_dispatch:

permissions: read-all

concurrency:
  group: signed-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    name: Validate release metadata
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      version: ${{ steps.package.outputs.version }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Read and validate package version
        id: package
        shell: bash
        run: |
          set -euo pipefail
          version="$(cargo run --quiet --locked -p xtask -- package-version)"
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "Validated Cargo package version ${version}"

  sbom-preflight:
    name: Validate CycloneDX SBOM generation
    if: github.event_name == 'pull_request'
    needs: validate
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      VERSION: ${{ needs.validate.outputs.version }}
      TARGET: x86_64-unknown-linux-gnu

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Rust 1.98.1
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          toolchain: 1.98.1

      - name: Generate and validate reproducible CycloneDX SBOM
        shell: bash
        run: |
          set -euo pipefail
          cargo install --locked cargo-cyclonedx --version 0.5.9
          SOURCE_DATE_EPOCH="$(git log -1 --format=%ct)"
          export SOURCE_DATE_EPOCH
          sbom="kaspa-pulse-${VERSION}.cdx.json"
          sbom_prefix="kaspa-pulse-${VERSION}.cdx"
          cargo cyclonedx \
            --format json \
            --spec-version 1.5 \
            --all-features \
            --target "$TARGET" \
            --override-filename "$sbom_prefix" \
            --verbose
          cargo xtask sbom finalize \
            "$sbom" \
            --version "$VERSION" \
            --target "$TARGET"

  verify-e2e-proof:
    name: Verify exact-main Hermetic E2E proof
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    permissions:
      actions: read
      contents: read

    steps:
      - name: Require main and checkout exact source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Wait for exact-main Hermetic E2E proof
        id: e2e
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = "refs/heads/main"
          deadline=$((SECONDS + 5100))
          run_id=""
          while (( SECONDS < deadline )); do
            runs="$(gh api               "/repos/$GITHUB_REPOSITORY/actions/workflows/hermetic-e2e.yml/runs?head_sha=$GITHUB_SHA&per_page=100")"
            latest="$(jq -c '
              [.workflow_runs[] |
               select(.head_sha == env.GITHUB_SHA and .head_branch == "main" and
                      (.event == "push" or .event == "workflow_dispatch"))][0] // null
            ' <<< "$runs")"
            if [[ "$latest" == "null" ]]; then
              sleep 15
              continue
            fi
            status="$(jq -r '.status' <<< "$latest")"
            conclusion="$(jq -r '.conclusion // ""' <<< "$latest")"
            if [[ "$status" != "completed" ]]; then
              sleep 15
              continue
            fi
            if [[ "$conclusion" != "success" ]]; then
              echo "Latest Hermetic E2E completed unsuccessfully for $GITHUB_SHA: $conclusion" >&2
              exit 1
            fi
            run_id="$(jq -r '.id' <<< "$latest")"
            break
          done
          test -n "$run_id"
          echo "run_id=$run_id" >> "$GITHUB_OUTPUT"

      - name: Download and verify canonical exact-main proof
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          E2E_RUN_ID: ${{ steps.e2e.outputs.run_id }}
        run: |
          set -euo pipefail
          tree="$(git rev-parse 'HEAD^{tree}')"
          out="$RUNNER_TEMP/exact-main-e2e"
          mkdir -p "$out"
          gh run download "$E2E_RUN_ID"             --repo "$GITHUB_REPOSITORY"             --name "hermetic-e2e-$GITHUB_SHA"             --dir "$out"
          proof="$(find "$out" -type f -name CANONICAL_SEMANTIC_PROOF.json -print -quit)"
          test -n "$proof"
          digest_file="${proof%.json}.sha256"
          test -f "$digest_file"
          jq -e --arg sha "$GITHUB_SHA" --arg tree "$tree" '
            .result == "PASS" and
            .audit_status == "COMPLETE" and
            .identity.tested_ref_kind == "MAIN" and
            .identity.tested_sha == $sha and
            .identity.source_head == $sha and
            .identity.tested_tree == $tree and
            .identity.source_tree == $tree and
            .scenario_summary.blocked == 0 and
            .scenario_summary.verified_fail == 0 and
            .scenario_summary.not_tested == 0
          ' "$proof" >/dev/null
          expected="$(tr -d '[:space:]' < "$digest_file")"
          actual="$(sha256sum "$proof" | awk '{print $1}')"
          test "$expected" = "$actual"

  release:
    name: Build, attest, and publish
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    needs: [validate, verify-e2e-proof]
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: write
      id-token: write
      attestations: write
      artifact-metadata: write
    env:
      VERSION: ${{ needs.validate.outputs.version }}
      TAG: v${{ needs.validate.outputs.version }}
      TARGET: x86_64-unknown-linux-gnu
      GH_TOKEN: ${{ github.token }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Determine whether this version is already released
        id: gate
        shell: bash
        run: |
          set -euo pipefail
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "create=false" >> "$GITHUB_OUTPUT"
            echo "$TAG already exists; no new release is needed."
          else
            echo "create=true" >> "$GITHUB_OUTPUT"
            echo "$TAG is not published; release construction will proceed."
          fi

      - name: Install Rust 1.98.1
        if: steps.gate.outputs.create == 'true'
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          toolchain: 1.98.1

      - name: Build locked release binary
        if: steps.gate.outputs.create == 'true'
        shell: bash
        env:
          KASPA_PULSE_SOURCE_REVISION: ${{ github.sha }}
        run: |
          set -euo pipefail
          cargo build --locked --release --all-features --target "$TARGET"

      - name: Generate reproducible CycloneDX SBOM
        if: steps.gate.outputs.create == 'true'
        shell: bash
        run: |
          set -euo pipefail
          cargo install --locked cargo-cyclonedx --version 0.5.9
          SOURCE_DATE_EPOCH="$(git log -1 --format=%ct)"
          export SOURCE_DATE_EPOCH
          sbom="kaspa-pulse-${VERSION}.cdx.json"
          sbom_prefix="kaspa-pulse-${VERSION}.cdx"
          cargo cyclonedx \
            --format json \
            --spec-version 1.5 \
            --all-features \
            --target "$TARGET" \
            --override-filename "$sbom_prefix" \
            --verbose
          cargo xtask sbom finalize \
            "$sbom" \
            --version "$VERSION" \
            --target "$TARGET"

      - name: Assemble deterministic release archive
        if: steps.gate.outputs.create == 'true'
        id: artifact
        shell: bash
        run: |
          set -euo pipefail
          archive="kaspa-pulse-${VERSION}-${TARGET}.tar.gz"
          sbom="kaspa-pulse-${VERSION}.cdx.json"
          mkdir -p dist/stage
          install -m 0755 "target/${TARGET}/release/kaspa-pulse" dist/stage/kaspa-pulse
          install -m 0644 LICENSE dist/stage/LICENSE
          install -m 0644 README.md dist/stage/README.md
          install -m 0644 "$sbom" "dist/${sbom}"
          source_date_epoch="$(git log -1 --format=%ct)"
          tar --sort=name \
            --mtime="@${source_date_epoch}" \
            --owner=0 --group=0 --numeric-owner \
            -C dist/stage -cf "dist/${archive%.gz}" .
          gzip -n -9 "dist/${archive%.gz}"
          rm -rf dist/stage
          (cd dist && sha256sum "$archive" > "${archive}.sha256")
          echo "archive=${archive}" >> "$GITHUB_OUTPUT"
          echo "sbom=${sbom}" >> "$GITHUB_OUTPUT"

      - name: Generate SLSA build provenance attestation
        if: steps.gate.outputs.create == 'true'
        id: provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: dist/${{ steps.artifact.outputs.archive }}

      - name: Generate SBOM attestation
        if: steps.gate.outputs.create == 'true'
        id: sbom-attestation
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: dist/${{ steps.artifact.outputs.archive }}
          sbom-path: dist/${{ steps.artifact.outputs.sbom }}

      - name: Export signed attestation bundles
        if: steps.gate.outputs.create == 'true'
        shell: bash
        env:
          PROVENANCE_BUNDLE: ${{ steps.provenance.outputs.bundle-path }}
          SBOM_BUNDLE: ${{ steps.sbom-attestation.outputs.bundle-path }}
          ARCHIVE: ${{ steps.artifact.outputs.archive }}
        run: |
          set -euo pipefail
          cp "$PROVENANCE_BUNDLE" "dist/${ARCHIVE}.sigstore.json"
          cp "$SBOM_BUNDLE" "dist/${ARCHIVE}.sbom.sigstore.json"

      - name: Export and verify SLSA provenance JSONL
        if: steps.gate.outputs.create == 'true'
        shell: bash
        env:
          ARCHIVE: ${{ steps.artifact.outputs.archive }}
        run: |
          set -euo pipefail
          mkdir -p provenance-download
          success=false
          for attempt in 1 2 3 4 5; do
            rm -f provenance-download/sha256*.jsonl
            if (cd provenance-download && gh attestation download "../dist/${ARCHIVE}" \
                --repo "$GITHUB_REPOSITORY" \
                --predicate-type "https://slsa.dev/provenance/v1"); then
              success=true
              break
            fi
            sleep $((attempt * 2))
          done
          test "$success" = true
          provenance_file="$(find provenance-download -maxdepth 1 -type f -name 'sha256*.jsonl' -print -quit)"
          test -n "$provenance_file"
          mv "$provenance_file" "dist/${ARCHIVE}.intoto.jsonl"
          gh attestation verify "dist/${ARCHIVE}" \
            --repo "$GITHUB_REPOSITORY" \
            --bundle "dist/${ARCHIVE}.intoto.jsonl" \
            --source-digest "$GITHUB_SHA" \
            --signer-workflow "$GITHUB_REPOSITORY/.github/workflows/release.yml"

      - name: Publish immutable versioned release assets
        if: steps.gate.outputs.create == 'true'
        shell: bash
        env:
          ARCHIVE: ${{ steps.artifact.outputs.archive }}
          SBOM: ${{ steps.artifact.outputs.sbom }}
        run: |
          set -euo pipefail
          gh release create "$TAG" \
            "dist/${ARCHIVE}" \
            "dist/${ARCHIVE}.sha256" \
            "dist/${SBOM}" \
            "dist/${ARCHIVE}.sigstore.json" \
            "dist/${ARCHIVE}.sbom.sigstore.json" \
            "dist/${ARCHIVE}.intoto.jsonl" \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "Kaspa Pulse ${TAG}" \
            --generate-notes

      - name: Verify published release manifest
        if: steps.gate.outputs.create == 'true'
        shell: bash
        run: |
          set -euo pipefail
          gh release view "$TAG" --repo "$GITHUB_REPOSITORY" \
            --json tagName,isDraft,isPrerelease,targetCommitish,assets
