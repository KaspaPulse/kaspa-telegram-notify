name: Signed Release

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    paths:
      - "Cargo.toml"
      - "Cargo.lock"
      - "Dockerfile"
      - ".dockerignore"
      - "xtask/src/sbom.rs"
      - ".github/workflows/release.yml"
  workflow_dispatch:

permissions: read-all

concurrency:
  group: signed-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    name: Validate release metadata
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      version: ${{ steps.package.outputs.version }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Read and validate package version
        id: package
        shell: bash
        run: |
          set -euo pipefail
          version="$(cargo run --quiet --locked -p xtask -- package-version)"
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "Validated Cargo package version ${version}"

  sbom-preflight:
    name: Validate CycloneDX SBOM generation
    if: github.event_name == 'pull_request'
    needs: validate
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        target:
          - x86_64-unknown-linux-gnu
          - aarch64-unknown-linux-gnu
    env:
      VERSION: ${{ needs.validate.outputs.version }}
      TARGET: ${{ matrix.target }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Rust 1.98.1
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          toolchain: 1.98.1

      - name: Generate and validate reproducible CycloneDX SBOM
        shell: bash
        run: |
          set -euo pipefail
          cargo install --locked cargo-cyclonedx --version 0.5.9
          SOURCE_DATE_EPOCH="$(git log -1 --format=%ct)"
          export SOURCE_DATE_EPOCH
          sbom="kaspa-pulse-${VERSION}-${TARGET}.cdx.json"
          sbom_prefix="kaspa-pulse-${VERSION}-${TARGET}.cdx"
          cargo cyclonedx \
            --format json \
            --spec-version 1.5 \
            --all-features \
            --target "$TARGET" \
            --override-filename "$sbom_prefix" \
            --verbose
          cargo xtask sbom finalize \
            "$sbom" \
            --version "$VERSION" \
            --target "$TARGET"

  arm64-release-preflight:
    name: Validate ARM64 release image
    if: github.event_name == 'pull_request'
    needs: validate
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 45
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Build and verify ARM64 release image
        shell: bash
        env:
          ARM64_IMAGE: kaspa-pulse:release-arm64-preflight-${{ github.sha }}
        run: |
          set -euo pipefail
          docker buildx build \
            --platform linux/arm64 \
            --build-arg SOURCE_REVISION="$GITHUB_SHA" \
            --tag "$ARM64_IMAGE" \
            --load \
            .
          test "$(docker image inspect "$ARM64_IMAGE" --format '{{.Architecture}}')" = "arm64"
          test "$(docker image inspect "$ARM64_IMAGE" --format '{{index .Config.Labels "org.opencontainers.image.revision"}}')" = "$GITHUB_SHA"
          cid="$(docker create --platform linux/arm64 "$ARM64_IMAGE")"
          trap 'docker rm -f "$cid" >/dev/null 2>&1 || true' EXIT
          docker cp "$cid:/usr/local/bin/kaspa-pulse" "$RUNNER_TEMP/kaspa-pulse-aarch64"
          file "$RUNNER_TEMP/kaspa-pulse-aarch64" | grep -F "ARM aarch64"
          LC_ALL=C grep -aF -q "$GITHUB_SHA" "$RUNNER_TEMP/kaspa-pulse-aarch64"
          docker rm "$cid" >/dev/null
          trap - EXIT

  verify-e2e-proof:
    name: Verify exact-main Hermetic E2E proof
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    permissions:
      actions: read
      contents: read

    steps:
      - name: Require main and checkout exact source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Wait for exact-main Hermetic E2E proof
        id: e2e
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = "refs/heads/main"
          deadline=$((SECONDS + 5100))
          run_id=""
          while (( SECONDS < deadline )); do
            runs="$(gh api               "/repos/$GITHUB_REPOSITORY/actions/workflows/hermetic-e2e.yml/runs?head_sha=$GITHUB_SHA&per_page=100")"
            latest="$(jq -c '
              [.workflow_runs[] |
               select(.head_sha == env.GITHUB_SHA and .head_branch == "main" and
                      (.event == "push" or .event == "workflow_dispatch"))][0] // null
            ' <<< "$runs")"
            if [[ "$latest" == "null" ]]; then
              sleep 15
              continue
            fi
            status="$(jq -r '.status' <<< "$latest")"
            conclusion="$(jq -r '.conclusion // ""' <<< "$latest")"
            if [[ "$status" != "completed" ]]; then
              sleep 15
              continue
            fi
            if [[ "$conclusion" != "success" ]]; then
              echo "Latest Hermetic E2E completed unsuccessfully for $GITHUB_SHA: $conclusion" >&2
              exit 1
            fi
            run_id="$(jq -r '.id' <<< "$latest")"
            break
          done
          test -n "$run_id"
          echo "run_id=$run_id" >> "$GITHUB_OUTPUT"

      - name: Download and verify canonical exact-main proof
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          E2E_RUN_ID: ${{ steps.e2e.outputs.run_id }}
        run: |
          set -euo pipefail
          tree="$(git rev-parse 'HEAD^{tree}')"
          out="$RUNNER_TEMP/exact-main-e2e"
          mkdir -p "$out"
          gh run download "$E2E_RUN_ID"             --repo "$GITHUB_REPOSITORY"             --name "hermetic-e2e-$GITHUB_SHA"             --dir "$out"
          proof="$(find "$out" -type f -name CANONICAL_SEMANTIC_PROOF.json -print -quit)"
          test -n "$proof"
          digest_file="${proof%.json}.sha256"
          test -f "$digest_file"
          jq -e --arg sha "$GITHUB_SHA" --arg tree "$tree" '
            .result == "PASS" and
            .audit_status == "COMPLETE" and
            .identity.tested_ref_kind == "MAIN" and
            .identity.tested_sha == $sha and
            .identity.source_head == $sha and
            .identity.tested_tree == $tree and
            .identity.source_tree == $tree and
            .scenario_summary.blocked == 0 and
            .scenario_summary.verified_fail == 0 and
            .scenario_summary.not_tested == 0
          ' "$proof" >/dev/null
          expected="$(tr -d '[:space:]' < "$digest_file")"
          actual="$(sha256sum "$proof" | awk '{print $1}')"
          test "$expected" = "$actual"

  arm64-release-build:
    name: Build and attest ARM64 release
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    needs: [validate, verify-e2e-proof]
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 60
    permissions:
      contents: read
      id-token: write
      attestations: write
      artifact-metadata: write
    env:
      VERSION: ${{ needs.validate.outputs.version }}
      ARM64_TARGET: aarch64-unknown-linux-gnu
      ARM64_IMAGE: kaspa-pulse:release-arm64-${{ github.sha }}
      ARM64_ARCHIVE: kaspa-pulse-${{ needs.validate.outputs.version }}-aarch64-unknown-linux-gnu.tar.gz
      ARM64_SBOM: kaspa-pulse-${{ needs.validate.outputs.version }}-aarch64-unknown-linux-gnu.cdx.json
      GH_TOKEN: ${{ github.token }}

    steps:
      - name: Checkout exact source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Install Rust 1.98.1
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          toolchain: 1.98.1

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Build and extract locked ARM64 release binary
        shell: bash
        run: |
          set -euo pipefail
          docker buildx build \
            --platform linux/arm64 \
            --build-arg SOURCE_REVISION="$GITHUB_SHA" \
            --tag "$ARM64_IMAGE" \
            --load \
            .
          test "$(docker image inspect "$ARM64_IMAGE" --format '{{.Architecture}}')" = "arm64"
          test "$(docker image inspect "$ARM64_IMAGE" --format '{{index .Config.Labels "org.opencontainers.image.revision"}}')" = "$GITHUB_SHA"
          mkdir -p "target/${ARM64_TARGET}/release"
          cid="$(docker create --platform linux/arm64 "$ARM64_IMAGE")"
          trap 'docker rm -f "$cid" >/dev/null 2>&1 || true' EXIT
          docker cp "$cid:/usr/local/bin/kaspa-pulse" "target/${ARM64_TARGET}/release/kaspa-pulse"
          chmod 0755 "target/${ARM64_TARGET}/release/kaspa-pulse"
          file "target/${ARM64_TARGET}/release/kaspa-pulse" | grep -F "ARM aarch64"
          LC_ALL=C grep -aF -q "$GITHUB_SHA" "target/${ARM64_TARGET}/release/kaspa-pulse"
          docker rm "$cid" >/dev/null
          trap - EXIT

      - name: Generate reproducible ARM64 CycloneDX SBOM
        shell: bash
        run: |
          set -euo pipefail
          cargo install --locked cargo-cyclonedx --version 0.5.9
          SOURCE_DATE_EPOCH="$(git log -1 --format=%ct)"
          export SOURCE_DATE_EPOCH
          sbom_prefix="kaspa-pulse-${VERSION}-${ARM64_TARGET}.cdx"
          cargo cyclonedx \
            --format json \
            --spec-version 1.5 \
            --all-features \
            --target "$ARM64_TARGET" \
            --override-filename "$sbom_prefix" \
            --verbose
          cargo xtask sbom finalize \
            "$ARM64_SBOM" \
            --version "$VERSION" \
            --target "$ARM64_TARGET"

      - name: Assemble deterministic ARM64 release archive
        shell: bash
        run: |
          set -euo pipefail
          source_date_epoch="$(git log -1 --format=%ct)"
          stage="dist/stage-${ARM64_TARGET}"
          mkdir -p "$stage"
          install -m 0755 "target/${ARM64_TARGET}/release/kaspa-pulse" "$stage/kaspa-pulse"
          install -m 0644 LICENSE "$stage/LICENSE"
          install -m 0644 README.md "$stage/README.md"
          install -m 0644 "$ARM64_SBOM" "dist/${ARM64_SBOM}"
          tar --sort=name \
            --mtime="@${source_date_epoch}" \
            --owner=0 --group=0 --numeric-owner \
            -C "$stage" -cf "dist/${ARM64_ARCHIVE%.gz}" .
          gzip -n -9 "dist/${ARM64_ARCHIVE%.gz}"
          rm -rf "$stage"
          (cd dist && sha256sum "$ARM64_ARCHIVE" > "${ARM64_ARCHIVE}.sha256")

      - name: Generate ARM64 SLSA build provenance attestation
        id: provenance-arm64
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: dist/${{ env.ARM64_ARCHIVE }}

      - name: Generate ARM64 SBOM attestation
        id: sbom-arm64
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: dist/${{ env.ARM64_ARCHIVE }}
          sbom-path: dist/${{ env.ARM64_SBOM }}

      - name: Export signed ARM64 attestation bundles
        shell: bash
        env:
          ARM64_PROVENANCE_BUNDLE: ${{ steps.provenance-arm64.outputs.bundle-path }}
          ARM64_SBOM_BUNDLE: ${{ steps.sbom-arm64.outputs.bundle-path }}
        run: |
          set -euo pipefail
          cp "$ARM64_PROVENANCE_BUNDLE" "dist/${ARM64_ARCHIVE}.sigstore.json"
          cp "$ARM64_SBOM_BUNDLE" "dist/${ARM64_ARCHIVE}.sbom.sigstore.json"

      - name: Export and verify ARM64 SLSA provenance JSONL
        shell: bash
        run: |
          set -euo pipefail
          out="provenance-download/${ARM64_ARCHIVE}"
          mkdir -p "$out"
          success=false
          for attempt in 1 2 3 4 5; do
            rm -f "$out"/sha256*.jsonl
            if (cd "$out" && gh attestation download "../../dist/${ARM64_ARCHIVE}" \
                --repo "$GITHUB_REPOSITORY" \
                --predicate-type "https://slsa.dev/provenance/v1"); then
              success=true
              break
            fi
            sleep $((attempt * 2))
          done
          test "$success" = true
          provenance_file="$(find "$out" -maxdepth 1 -type f -name 'sha256*.jsonl' -print -quit)"
          test -n "$provenance_file"
          mv "$provenance_file" "dist/${ARM64_ARCHIVE}.intoto.jsonl"
          gh attestation verify "dist/${ARM64_ARCHIVE}" \
            --repo "$GITHUB_REPOSITORY" \
            --bundle "dist/${ARM64_ARCHIVE}.intoto.jsonl" \
            --source-digest "$GITHUB_SHA" \
            --signer-workflow "$GITHUB_REPOSITORY/.github/workflows/release.yml"

      - name: Upload verified ARM64 release bundle
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: arm64-release-${{ github.sha }}
          path: |
            dist/${{ env.ARM64_ARCHIVE }}
            dist/${{ env.ARM64_ARCHIVE }}.sha256
            dist/${{ env.ARM64_SBOM }}
            dist/${{ env.ARM64_ARCHIVE }}.sigstore.json
            dist/${{ env.ARM64_ARCHIVE }}.sbom.sigstore.json
            dist/${{ env.ARM64_ARCHIVE }}.intoto.jsonl
          if-no-files-found: error
          retention-days: 1
          compression-level: 0

  release:
    name: Build, attest, and publish
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    needs: [validate, verify-e2e-proof, arm64-release-build]
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    permissions:
      contents: write
      id-token: write
      attestations: write
      artifact-metadata: write
    env:
      VERSION: ${{ needs.validate.outputs.version }}
      TAG: v${{ needs.validate.outputs.version }}
      X86_TARGET: x86_64-unknown-linux-gnu
      ARM64_TARGET: aarch64-unknown-linux-gnu
      ARM64_ARCHIVE: kaspa-pulse-${{ needs.validate.outputs.version }}-aarch64-unknown-linux-gnu.tar.gz
      ARM64_SBOM: kaspa-pulse-${{ needs.validate.outputs.version }}-aarch64-unknown-linux-gnu.cdx.json
      GH_TOKEN: ${{ github.token }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Determine whether this version is already released
        id: gate
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = "refs/heads/main"
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "create=false" >> "$GITHUB_OUTPUT"
            echo "$TAG already exists; no new release is needed."
          else
            echo "create=true" >> "$GITHUB_OUTPUT"
            echo "$TAG is not published; release construction will proceed."
          fi

      - name: Install Rust 1.98.1
        if: steps.gate.outputs.create == 'true'
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          toolchain: 1.98.1


      - name: Build locked x86_64 release binary
        if: steps.gate.outputs.create == 'true'
        shell: bash
        env:
          KASPA_PULSE_SOURCE_REVISION: ${{ github.sha }}
        run: |
          set -euo pipefail
          cargo build --locked --release --all-features --target "$X86_TARGET"
          LC_ALL=C grep -aF -q "$GITHUB_SHA" "target/${X86_TARGET}/release/kaspa-pulse"


      - name: Generate reproducible x86_64 CycloneDX SBOM
        if: steps.gate.outputs.create == 'true'
        shell: bash
        run: |
          set -euo pipefail
          cargo install --locked cargo-cyclonedx --version 0.5.9
          SOURCE_DATE_EPOCH="$(git log -1 --format=%ct)"
          export SOURCE_DATE_EPOCH
          sbom="kaspa-pulse-${VERSION}-${X86_TARGET}.cdx.json"
          sbom_prefix="kaspa-pulse-${VERSION}-${X86_TARGET}.cdx"
          cargo cyclonedx \
            --format json \
            --spec-version 1.5 \
            --all-features \
            --target "$X86_TARGET" \
            --override-filename "$sbom_prefix" \
            --verbose
          cargo xtask sbom finalize \
            "$sbom" \
            --version "$VERSION" \
            --target "$X86_TARGET"

      - name: Assemble deterministic x86_64 release archive
        if: steps.gate.outputs.create == 'true'
        id: artifact
        shell: bash
        run: |
          set -euo pipefail
          source_date_epoch="$(git log -1 --format=%ct)"
          mkdir -p dist
          stage="dist/stage-${X86_TARGET}"
          archive="kaspa-pulse-${VERSION}-${X86_TARGET}.tar.gz"
          sbom="kaspa-pulse-${VERSION}-${X86_TARGET}.cdx.json"
          mkdir -p "$stage"
          install -m 0755 "target/${X86_TARGET}/release/kaspa-pulse" "$stage/kaspa-pulse"
          install -m 0644 LICENSE "$stage/LICENSE"
          install -m 0644 README.md "$stage/README.md"
          install -m 0644 "$sbom" "dist/${sbom}"
          tar --sort=name \
            --mtime="@${source_date_epoch}" \
            --owner=0 --group=0 --numeric-owner \
            -C "$stage" -cf "dist/${archive%.gz}" .
          gzip -n -9 "dist/${archive%.gz}"
          rm -rf "$stage"
          (cd dist && sha256sum "$archive" > "${archive}.sha256")
          {
            echo "x86_archive=$archive"
            echo "x86_sbom=$sbom"
          } >> "$GITHUB_OUTPUT"

      - name: Generate x86_64 SLSA build provenance attestation
        if: steps.gate.outputs.create == 'true'
        id: provenance-x86
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: dist/${{ steps.artifact.outputs.x86_archive }}

      - name: Generate x86_64 SBOM attestation
        if: steps.gate.outputs.create == 'true'
        id: sbom-x86
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: dist/${{ steps.artifact.outputs.x86_archive }}
          sbom-path: dist/${{ steps.artifact.outputs.x86_sbom }}


      - name: Export signed x86_64 attestation bundles
        if: steps.gate.outputs.create == 'true'
        shell: bash
        env:
          X86_PROVENANCE_BUNDLE: ${{ steps.provenance-x86.outputs.bundle-path }}
          X86_SBOM_BUNDLE: ${{ steps.sbom-x86.outputs.bundle-path }}
          X86_ARCHIVE: ${{ steps.artifact.outputs.x86_archive }}
        run: |
          set -euo pipefail
          cp "$X86_PROVENANCE_BUNDLE" "dist/${X86_ARCHIVE}.sigstore.json"
          cp "$X86_SBOM_BUNDLE" "dist/${X86_ARCHIVE}.sbom.sigstore.json"

      - name: Export and verify x86_64 SLSA provenance JSONL
        if: steps.gate.outputs.create == 'true'
        shell: bash
        env:
          X86_ARCHIVE: ${{ steps.artifact.outputs.x86_archive }}
        run: |
          set -euo pipefail
          out="provenance-download/${X86_ARCHIVE}"
          mkdir -p "$out"
          success=false
          for attempt in 1 2 3 4 5; do
            rm -f "$out"/sha256*.jsonl
            if (cd "$out" && gh attestation download "../../dist/${X86_ARCHIVE}" \
                --repo "$GITHUB_REPOSITORY" \
                --predicate-type "https://slsa.dev/provenance/v1"); then
              success=true
              break
            fi
            sleep $((attempt * 2))
          done
          test "$success" = true
          provenance_file="$(find "$out" -maxdepth 1 -type f -name 'sha256*.jsonl' -print -quit)"
          test -n "$provenance_file"
          mv "$provenance_file" "dist/${X86_ARCHIVE}.intoto.jsonl"
          gh attestation verify "dist/${X86_ARCHIVE}" \
            --repo "$GITHUB_REPOSITORY" \
            --bundle "dist/${X86_ARCHIVE}.intoto.jsonl" \
            --source-digest "$GITHUB_SHA" \
            --signer-workflow "$GITHUB_REPOSITORY/.github/workflows/release.yml"

      - name: Download native ARM64 release bundle
        if: steps.gate.outputs.create == 'true'
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: arm64-release-${{ github.sha }}
          path: dist

      - name: Verify native ARM64 release bundle before publication
        if: steps.gate.outputs.create == 'true'
        shell: bash
        run: |
          set -euo pipefail
          (
            cd dist
            sha256sum --check "${ARM64_ARCHIVE}.sha256"
            gh attestation verify "$ARM64_ARCHIVE" \
              --repo "$GITHUB_REPOSITORY" \
              --bundle "${ARM64_ARCHIVE}.intoto.jsonl" \
              --source-digest "$GITHUB_SHA" \
              --signer-workflow "$GITHUB_REPOSITORY/.github/workflows/release.yml"
          )
          out="$RUNNER_TEMP/native-arm64-prepublish"
          mkdir -p "$out"
          tar -xzf "dist/${ARM64_ARCHIVE}" -C "$out"
          file "$out/kaspa-pulse" | grep -F "ARM aarch64"
          LC_ALL=C grep -aF -q "$GITHUB_SHA" "$out/kaspa-pulse"
          test -s "dist/${ARM64_SBOM}"
          test -s "dist/${ARM64_ARCHIVE}.sigstore.json"
          test -s "dist/${ARM64_ARCHIVE}.sbom.sigstore.json"

      - name: Publish immutable versioned release assets
        if: steps.gate.outputs.create == 'true'
        shell: bash
        env:
          X86_ARCHIVE: ${{ steps.artifact.outputs.x86_archive }}
          X86_SBOM: ${{ steps.artifact.outputs.x86_sbom }}
        run: |
          set -euo pipefail
          gh release create "$TAG" \
            "dist/${X86_ARCHIVE}" \
            "dist/${X86_ARCHIVE}.sha256" \
            "dist/${X86_SBOM}" \
            "dist/${X86_ARCHIVE}.sigstore.json" \
            "dist/${X86_ARCHIVE}.sbom.sigstore.json" \
            "dist/${X86_ARCHIVE}.intoto.jsonl" \
            "dist/${ARM64_ARCHIVE}" \
            "dist/${ARM64_ARCHIVE}.sha256" \
            "dist/${ARM64_SBOM}" \
            "dist/${ARM64_ARCHIVE}.sigstore.json" \
            "dist/${ARM64_ARCHIVE}.sbom.sigstore.json" \
            "dist/${ARM64_ARCHIVE}.intoto.jsonl" \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "Kaspa Pulse ${TAG}" \
            --generate-notes

      - name: Verify published immutable release manifest
        if: steps.gate.outputs.create == 'true'
        shell: bash
        env:
          X86_ARCHIVE: ${{ steps.artifact.outputs.x86_archive }}
          X86_SBOM: ${{ steps.artifact.outputs.x86_sbom }}
        run: |
          set -euo pipefail
          expected_assets="$RUNNER_TEMP/expected-release-assets.txt"
          actual_assets="$RUNNER_TEMP/actual-release-assets.txt"
          printf '%s\n' \
            "$X86_ARCHIVE" \
            "${X86_ARCHIVE}.sha256" \
            "$X86_SBOM" \
            "${X86_ARCHIVE}.sigstore.json" \
            "${X86_ARCHIVE}.sbom.sigstore.json" \
            "${X86_ARCHIVE}.intoto.jsonl" \
            "$ARM64_ARCHIVE" \
            "${ARM64_ARCHIVE}.sha256" \
            "$ARM64_SBOM" \
            "${ARM64_ARCHIVE}.sigstore.json" \
            "${ARM64_ARCHIVE}.sbom.sigstore.json" \
            "${ARM64_ARCHIVE}.intoto.jsonl" | sort > "$expected_assets"

          immutable=false
          manifest=""
          for _ in $(seq 1 30); do
            manifest="$(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" \
              --json tagName,isDraft,isPrerelease,isImmutable,targetCommitish,assets)"
            immutable="$(jq -r '.isImmutable' <<< "$manifest")"
            if [[ "$immutable" == "true" ]]; then
              break
            fi
            sleep 2
          done

          jq -e --arg tag "$TAG" --arg sha "$GITHUB_SHA" '
            .tagName == $tag and
            .isDraft == false and
            .isPrerelease == false and
            .isImmutable == true and
            .targetCommitish == $sha
          ' <<< "$manifest" >/dev/null
          jq -r '.assets[].name' <<< "$manifest" | sort > "$actual_assets"
          diff -u "$expected_assets" "$actual_assets"

      - name: Verify published ARM64 bytes and provenance
        if: steps.gate.outputs.create == 'true'
        shell: bash
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/published-arm64"
          mkdir -p "$out"
          gh release download "$TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --pattern "$ARM64_ARCHIVE" \
            --pattern "${ARM64_ARCHIVE}.sha256" \
            --pattern "${ARM64_ARCHIVE}.intoto.jsonl" \
            --dir "$out"
          (
            cd "$out"
            sha256sum --check "${ARM64_ARCHIVE}.sha256"
            gh attestation verify "$ARM64_ARCHIVE" \
              --repo "$GITHUB_REPOSITORY" \
              --bundle "${ARM64_ARCHIVE}.intoto.jsonl" \
              --source-digest "$GITHUB_SHA" \
              --signer-workflow "$GITHUB_REPOSITORY/.github/workflows/release.yml"
            mkdir extract
            tar -xzf "$ARM64_ARCHIVE" -C extract
            file extract/kaspa-pulse | grep -F "ARM aarch64"
            LC_ALL=C grep -aF -q "$GITHUB_SHA" extract/kaspa-pulse
          )
