name: External Contract E2E

on:
  schedule:
    - cron: "37 4 * * *"
  workflow_dispatch:
    inputs:
      run_telegram:
        description: "Run the Telegram Test Environment contract (requires protected test credentials)"
        required: false
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: external-contract-e2e-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  RUST_BACKTRACE: 1

jobs:
  kaspa-live-contract:
    name: Live Kaspa provider contract
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Rust 1.98.1
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          toolchain: 1.98.1

      - name: Cache Cargo
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      - name: Run read-only live Kaspa contract
        env:
          KASPA_LIVE_WRPC_URL: ${{ vars.KASPA_LIVE_WRPC_URL }}
          KASPA_EXPECTED_SERVER_VERSION: ${{ vars.KASPA_EXPECTED_SERVER_VERSION }}
          EXTERNAL_CONTRACT_EVIDENCE_PATH: target/external-contract-evidence/kaspa-live.json
        run: |
          set -euo pipefail
          endpoint="${KASPA_LIVE_WRPC_URL:-resolver}"
          KASPA_LIVE_WRPC_URL="$endpoint" \
            cargo test --locked --test kaspa_live_compatibility_tests \
              live_latest_kaspa_wrpc_contract -- --ignored --exact --nocapture

      - name: Upload Kaspa provider evidence
        if: success()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: kaspa-external-contract-${{ github.sha }}
          path: target/external-contract-evidence/kaspa-live.json
          if-no-files-found: error
          retention-days: 30

  telegram-test-environment-contract:
    name: Telegram Test Environment contract
    if: github.event_name == 'workflow_dispatch' && inputs.run_telegram == true && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment: external-contract-e2e
    env:
      TELEGRAM_TEST_BOT_TOKEN: ${{ secrets.TELEGRAM_TEST_BOT_TOKEN }}
      TELEGRAM_TEST_CHAT_ID: ${{ secrets.TELEGRAM_TEST_CHAT_ID }}
      EXTERNAL_CONTRACT_EVIDENCE_PATH: target/external-contract-evidence/telegram-test.json

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Rust 1.98.1
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          toolchain: 1.98.1

      - name: Cache Cargo
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      - name: Verify dedicated test credentials are configured
        run: |
          set -euo pipefail
          if [ -z "${TELEGRAM_TEST_BOT_TOKEN:-}" ] || [ -z "${TELEGRAM_TEST_CHAT_ID:-}" ]; then
            echo "::error::Dedicated Telegram Test Environment credentials are not configured."
            exit 1
          fi

      - name: Run read-only Telegram Test Environment contract
        run: |
          set -euo pipefail
          cargo test --locked --test telegram_test_environment_contract_tests \
            telegram_test_environment_contract -- --ignored --exact --nocapture

      - name: Upload Telegram provider evidence
        if: success()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: telegram-test-environment-contract-${{ github.sha }}
          path: target/external-contract-evidence/telegram-test.json
          if-no-files-found: error
          retention-days: 30
