name: Manually qualify release binaries

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: kaspa-pulse-manual-binaries
  cancel-in-progress: false

jobs:
  native:
    name: Source build (${{ matrix.arch }})
    if: github.ref == 'refs/heads/main'
    strategy:
      fail-fast: true
      max-parallel: 1
      matrix:
        include:
          - runner: ubuntu-24.04
            arch: x86_64
            target: x86_64-unknown-linux-gnu
          - runner: ubuntu-24.04-arm
            arch: aarch64
            target: aarch64-unknown-linux-gnu
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    env:
      CARGO_BUILD_JOBS: 2
      CARGO_INCREMENTAL: "0"
      SQLX_OFFLINE: "true"
      CARGO_TERM_COLOR: always

    steps:
      - name: Checkout exactly the selected main commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Rust stable
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          toolchain: 1.99.1
      - name: Install native build prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends pkg-config libssl-dev ca-certificates
      - name: Verify build source and target
        run: |
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(rustc -vV | sed -n 's/^host: //p')" = "${{ matrix.target }}"
          test -z "$(git status --porcelain)"
          cargo metadata --locked --format-version=1 --no-deps >/dev/null
      - name: Build release mode (no production deployment)
        run: cargo build --locked --release --bin kaspa-block-alert-bot
      - name: Verify native architecture and deterministic archive
        shell: bash
        run: |
          set -Eeuo pipefail
          install -d dist package
          install -m 0755 target/release/kaspa-block-alert-bot package/kaspa-block-alert-bot
          install -m 0644 LICENSE README.md package/
          file package/kaspa-block-alert-bot
          readelf -h package/kaspa-block-alert-bot | grep 'Machine:'
          file package/kaspa-block-alert-bot | grep -F '${{ matrix.arch }}' >/dev/null || {
            case '${{ matrix.arch }}' in
              x86_64) file package/kaspa-block-alert-bot | grep -F 'x86-64' ;;
              aarch64) file package/kaspa-block-alert-bot | grep -F 'aarch64' ;;
              *) exit 1 ;;
            esac
          }
          short="${GITHUB_SHA:0:12}"
          base="kaspa-pulse-${short}-linux-${{ matrix.arch }}"
          tar --sort=name --mtime=@0 --owner=0 --group=0 --numeric-owner -C package -cf - . |
            gzip -n -9 >"dist/${base}.tar.gz"
          (cd dist && sha256sum "${base}.tar.gz" >"${base}.tar.gz.sha256")
          (cd dist && sha256sum -c "${base}.tar.gz.sha256")
      - name: Retain unsigned candidate artifacts for review only
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: source-build-${{ matrix.arch }}-${{ github.sha }}
          path: dist/*
          if-no-files-found: error
          retention-days: 7
          compression-level: 0
