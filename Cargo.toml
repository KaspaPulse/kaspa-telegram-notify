[package]
name = "kaspa-pulse"
version = "1.2.0"
edition = "2024"
rust-version = "1.97.1"
license = "MIT"
description = "Kaspa Pulse Mining Bot - Lightweight community build"
publish = false

[lints.rust]
unsafe_code = "forbid"

[dependencies]
tokio = { version = "1", features = ["full", "time", "tracing"] }
tokio-util = "0.7"
teloxide = { version = "0.17", features = ["macros", "webhooks-axum"] }
axum = "0.8"

async-trait = "0.1.80"
async-channel = "2.5.0"
anyhow = "1.0"
thiserror = "2.0"

kaspa-wrpc-client = { git = "https://github.com/kaspanet/rusty-kaspa", tag = "v2.0.1" }
kaspa-rpc-core = { git = "https://github.com/kaspanet/rusty-kaspa", tag = "v2.0.1" }
kaspa-addresses = { git = "https://github.com/kaspanet/rusty-kaspa", tag = "v2.0.1" }
kaspa-consensus-core = { git = "https://github.com/kaspanet/rusty-kaspa", tag = "v2.0.1" }
kaspa-hashes = { git = "https://github.com/kaspanet/rusty-kaspa", tag = "v2.0.1" }

sqlx = { version = "0.9", default-features = false, features = ["postgres", "runtime-tokio", "tls-rustls", "macros", "chrono", "json"] }

chrono = "0.4"
dotenvy = "0.15"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

reqwest = { version = "0.13", features = ["json", "multipart", "query", "rustls"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
sysinfo = "0.39"
dashmap = "6.2"
governor = "0.10"
rand = "0.10"
sha2 = "0.11"

tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[dev-dependencies]
tokio = { version = "1", features = ["test-util"] }

[features]
default = []

[profile.dev]
opt-level = 1

[profile.release]
lto = true
codegen-units = 1
strip = true
panic = "abort"
