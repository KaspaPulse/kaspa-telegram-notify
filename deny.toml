[licenses]
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "Unlicense",
    "BSD-3-Clause",
    "BSD-2-Clause",
    "0BSD",
    "ISC",
    "CC0-1.0",
    "Unicode-3.0",
    "Zlib",
    "MPL-2.0",
    "LGPL-3.0-only",
    "CDLA-Permissive-2.0",
]

[bans]
multiple-versions = "allow"
wildcards = "warn"

[advisories]
ignore = [
    "RUSTSEC-2024-0388", # derivative: unmaintained, transitive through the Kaspa/Arkworks stack. See SECURITY_ADVISORIES.md.
    "RUSTSEC-2026-0173", # proc-macro-error2: unmaintained build-time transitive dependency. See SECURITY_ADVISORIES.md.
    "RUSTSEC-2025-0052", # async-std: upstream Kaspa SDK transitive dependency. See SECURITY_ADVISORIES.md.
    "RUSTSEC-2024-0375", # atty: upstream transitive dependency. See SECURITY_ADVISORIES.md.
    "RUSTSEC-2024-0384", # instant: upstream transitive dependency. See SECURITY_ADVISORIES.md.
    "RUSTSEC-2024-0436", # paste: upstream transitive/build dependency. See SECURITY_ADVISORIES.md.
    "RUSTSEC-2024-0370", # proc-macro-error: upstream transitive/build dependency. See SECURITY_ADVISORIES.md.
]
unmaintained = "all"
yanked = "deny"

[sources]
unknown-registry = "warn"
unknown-git = "deny"
allow-git = [
    "https://github.com/kaspanet/rusty-kaspa",
]
