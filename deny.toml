[licenses]
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "Unlicense",
    "BSD-3-Clause",
    "BSD-2-Clause",
    "0BSD",
    "ISC",
    "CC0-1.0",
    "Unicode-3.0",
    "Zlib",
    "MPL-2.0",
    "LGPL-3.0-only",
    "CDLA-Permissive-2.0",
]

[bans]
multiple-versions = "allow"
wildcards = "deny"

[advisories]
ignore = [
    # Unmaintained upstream dependencies, never a blanket vulnerability waiver.
    # Exact reverse dependency trees and review notes are in SECURITY_ADVISORIES.md.
    "RUSTSEC-2024-0388", # derivative (Kaspa txscript -> Arkworks).
    "RUSTSEC-2026-0173", # proc-macro-error2 (Teloxide -> aquamarine).
    "RUSTSEC-2024-0449", # unsafe-libyaml (Kaspa core -> log4rs -> serde_yaml).
    "RUSTSEC-2025-0052", # async-std (Kaspa workflow-core; discontinued).
    "RUSTSEC-2024-0375", # atty (Kaspa txscript -> hexplay).
    "RUSTSEC-2024-0384", # instant (Kaspa workflow-core).
    "RUSTSEC-2024-0436", # paste (Kaspa crates and risc0-zkp).
    "RUSTSEC-2024-0370", # proc-macro-error (Kaspa RPC macros, workflow-core macros).
]
unmaintained = "all"
yanked = "deny"

[sources]
unknown-registry = "warn"
unknown-git = "deny"
allow-git = [
    "https://github.com/kaspanet/rusty-kaspa",
]
