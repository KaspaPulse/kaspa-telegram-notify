canonical_release_artifact = "PUBLISHED_ATTESTED_GITHUB_RELEASE"
private_host_identity_in_public_policy = "FORBIDDEN"

[ci_identity]
fixture_kind = "SYNTHETIC"
admin_user_id = "9000000000000000000"
admin_chat_id = "9000000000000000000"
telegram_api_url = "http://127.0.0.1:9/"
external_telegram_access = "FORBIDDEN"
real_user_lookup = "FORBIDDEN"
real_message_delivery = "FORBIDDEN"

[[advisory_exception]]
id = "RUSTSEC-2025-0052"
package = "async-std 1.13.2"
dependency_path = "async-std -> workflow-core 0.18.0 -> pinned rusty-kaspa 2.1.0 graph"
direct_or_transitive = "TRANSITIVE"
runtime_or_build_time = "RUNTIME_TRANSITIVE"
target_reachability = "SUPPORTED_LINUX_TARGETS_TRANSITIVE"
security_impact = "UNMAINTAINED_UPSTREAM_DEPENDENCY"
justification = "Reviewed 2026-10-04: async-std 1.13.2 is transitive through workflow-core 0.18.0 in pinned rusty-kaspa v2.1.0; the application has no direct async-std dependency and no compatible stable upstream path removes it."
reviewed_at = "2026-10-04"
expires_at = "2026-10-15"
remediation_trigger = "Remove the exception when the pinned rusty-kaspa dependency path no longer resolves async-std or a compatible maintained path becomes available."
upstream_blocker_if_any = "Pinned rusty-kaspa 2.1.0 workflow dependency graph."
scanners = ["OSV", "CARGO_AUDIT", "CARGO_DENY"]

