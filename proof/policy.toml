schema_version = "1.2.0"
policy_version = 3
proof_artifact_dir = "target/proof"
targets = ["aarch64-unknown-linux-gnu", "x86_64-unknown-linux-gnu"]
msrv = "1.97.1"
toolchain = "1.98.1"
slsa_claim = "NOT_ASSERTED"
policy_owner = "KaspaPulse repository owner"
required_ci_workflow = ".github/workflows/security.yml"
