[package]
name = "xtask"
version = "0.1.0"
edition = "2024"
rust-version = "1.98.1"
publish = false

[lints.rust]
unsafe_code = "forbid"

[dependencies]
anyhow = "1.0"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
clap = { version = "4.5", features = ["derive"] }
regex = "1.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "0.8"
uuid = { version = "1.0", features = ["v5"] }

[dev-dependencies]
tempfile = "3.0"
